name: Link check

# Deliberately separate from Validate and deliberately never blocking: a
# publisher having a bad afternoon must not stop an unrelated pull request, and
# a pull request must not depend on the open internet being reachable.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Fetch every feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every feed
        id: check
        run: |
          node scripts/link-check.mjs --json > report.json
          echo "failures=$(node -e 'console.log(require("./report.json").failures.length)')" >> "$GITHUB_OUTPUT"

      - name: Report broken feeds
        if: steps.check.outputs.failures != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('./report.json');
            const lines = report.failures
              .map((failure) => `- \`${failure.id}\` — ${failure.reason}`)
              .join('\n');
            const body =
              `${report.failures.length} of ${report.checked} feeds could not be read on ` +
              `${new Date().toISOString().slice(0, 10)}.\n\n${lines}\n\n` +
              'Each needs a corrected URL or removal from its shard. A feed that ' +
              'refuses our User-Agent cannot be read by the app either, so it does ' +
              'not belong in the catalog.\n\n' +
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const title = 'Broken feeds in the catalog';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-check'],
              });
            }
